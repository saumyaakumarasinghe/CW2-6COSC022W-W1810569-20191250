paths:
  /api/v1/comment:
    post:
      tags:
        - Comments
      summary: Create a new comment
      description: Creates a new comment on a blog post.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - postId
                - content
              properties:
                postId:
                  type: integer
                  example: 1
                content:
                  type: string
                  example: 'Great post! I really enjoyed reading about your trip.'
      responses:
        201:
          description: Comment created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        400:
          description: Invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid request body properties'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

  /api/v1/comment/{postId}:
    get:
      tags:
        - Comments
      summary: Get all comments for a post
      description: Retrieves all comments for a specific blog post.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
          description: Blog post ID
      responses:
        200:
          description: Comments retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 25
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        400:
          description: Post ID is required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Post ID is required'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

    delete:
      tags:
        - Comments
      summary: Delete a comment
      description: |
        Deletes a comment. Only the comment owner can delete it. 
        Note: The route parameter is named 'postId' but it actually represents the comment ID.
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
          description: Comment ID (route parameter is postId but represents comment ID)
      responses:
        200:
          description: Comment deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Comment deleted successfully'
        403:
          description: Not authorized to delete this comment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'You are not authorized to delete this comment'
        404:
          description: Comment not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Comment not found'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

components:
  schemas:
    Comment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        postId:
          type: integer
          example: 1
        content:
          type: string
          example: 'Great post! I really enjoyed reading about your trip.'
        status:
          type: string
          enum: [active, deleted]
          example: 'active'
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        user:
          $ref: '#/components/schemas/User'

    CreateCommentRequest:
      type: object
      required:
        - postId
        - content
      properties:
        postId:
          type: integer
          example: 1
        content:
          type: string
          example: 'Great post! I really enjoyed reading about your trip.'

    CommentListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 25
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userName:
          type: string
          example: johndoe
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          example: john.doe@example.com

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Operation successful'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Error message'
        error:
          type: string
          example: 'Error message'
