paths:
  /api/v1/user:
    post:
      tags:
        - Users
      summary: Create a new user
      description: Creates a new user account (admin only).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
                - email
                - mobile
                - password
                - isSubscribed
              properties:
                userName:
                  type: string
                  example: johndoe
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                mobile:
                  type: string
                  example: '+1234567890'
                password:
                  type: string
                  format: password
                  example: 'StrongP@ssw0rd'
                isSubscribed:
                  type: boolean
                  example: true
      responses:
        201:
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        403:
          description: User already exists or invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User already exists'
        422:
          description: User already exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User already exists'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieves a list of all users in the system.
      security:
        - BearerAuth: []
      responses:
        200:
          description: Users retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

  /api/v1/user/{id}:
    get:
      tags:
        - Users
      summary: Get a single user
      description: Retrieves a specific user by ID.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        200:
          description: User retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        404:
          description: User not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User not found'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

    put:
      tags:
        - Users
      summary: Update a user
      description: Updates an existing user's information.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                  example: johndoe
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                mobile:
                  type: string
                  example: '+1234567890'
      responses:
        200:
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        403:
          description: Email already exists or forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Forbidden!'
        404:
          description: User not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User not found'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

    delete:
      tags:
        - Users
      summary: Delete a user
      description: Deletes a user from the system.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        200:
          description: User deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User deleted successfully'
        403:
          description: Self deletion not allowed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Self delete not allowed'
        404:
          description: User not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User not found'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

  /api/v1/user/{id}/status:
    patch:
      tags:
        - Users
      summary: Update user status
      description: Updates the active/inactive status of a user.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: boolean
                  example: false
      responses:
        200:
          description: User status updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        403:
          description: Self deactivation not allowed or invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Self deactivation not allowed'
        404:
          description: User not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User not found'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userName:
          type: string
          example: johndoe
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          example: john.doe@example.com
        mobile:
          type: string
          example: '+1234567890'
        lastActivateAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        status:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'

    CreateUserRequest:
      type: object
      required:
        - userName
        - email
        - mobile
        - password
        - isSubscribed
      properties:
        userName:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: john.doe@example.com
        mobile:
          type: string
          example: '+1234567890'
        password:
          type: string
          format: password
          example: 'StrongP@ssw0rd'
        isSubscribed:
          type: boolean
          example: true

    UpdateUserRequest:
      type: object
      properties:
        userName:
          type: string
          example: johndoe
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        mobile:
          type: string
          example: '+1234567890'

    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: boolean
          example: false

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Operation successful'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Error message'
        error:
          type: string
          example: 'Error message'
