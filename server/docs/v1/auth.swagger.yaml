paths:
  /api/v1/oauth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account in the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
                - firstName
                - lastName
                - email
                - mobile
                - password
              properties:
                userName:
                  type: string
                  example: johndoe
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                mobile:
                  type: string
                  example: '+1234567890'
                password:
                  type: string
                  format: password
                  example: 'StrongP@ssw0rd'
      responses:
        200:
          description: User registered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: integer
                    example: 1
        400:
          description: Invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid request body properties'
        403:
          description: User already exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User already exists'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Registration failed'

  /api/v1/oauth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticates a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: 'StrongP@ssw0rd'
      responses:
        200:
          description: Login successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Login successful'
                  token:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      firstName:
                        type: string
                        example: John
                      lastName:
                        type: string
                        example: Doe
                      userName:
                        type: string
                        example: johndoe
                      email:
                        type: string
                        example: john.doe@example.com
                      role:
                        type: string
                        example: 'USER'
                      status:
                        type: boolean
                        example: true
        400:
          description: Invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid request body properties'
        401:
          description: Invalid credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid credentials'
        403:
          description: User account is not active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User account is not active'
        404:
          description: User not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User not found'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Login failed'

  /api/v1/oauth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset user password
      description: Allows authenticated users to reset their password by providing old and new passwords.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  format: password
                  example: 'OldP@ssw0rd'
                newPassword:
                  type: string
                  format: password
                  example: 'NewP@ssw0rd'
      responses:
        200:
          description: Password reset successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Password reset successfully'
        400:
          description: Invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid request body properties'
        401:
          description: Invalid old password.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid credentials'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Password reset failed'

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - userName
        - firstName
        - lastName
        - email
        - mobile
        - password
      properties:
        userName:
          type: string
          example: johndoe
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        mobile:
          type: string
          example: '+1234567890'
        password:
          type: string
          format: password
          example: 'StrongP@ssw0rd'

    RegisterResponse:
      type: object
      properties:
        userId:
          type: integer
          example: 1

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          format: password
          example: 'StrongP@ssw0rd'

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Login successful'
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        user:
          $ref: '#/components/schemas/User'

    ResetPasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          format: password
          example: 'OldP@ssw0rd'
        newPassword:
          type: string
          format: password
          example: 'NewP@ssw0rd'

    ResetPasswordResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Password reset successfully'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        userName:
          type: string
          example: johndoe
        email:
          type: string
          example: john.doe@example.com
        role:
          type: string
          example: 'USER'
        status:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Error message'
