paths:
  /api/v1/blog-post:
    post:
      tags:
        - Blog Posts
      summary: Create a new blog post
      description: Creates a new blog post for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
                - country
              properties:
                title:
                  type: string
                  example: 'My Amazing Trip to Japan'
                content:
                  type: string
                  example: 'This was an incredible journey through the beautiful landscapes of Japan...'
                country:
                  type: string
                  example: 'Japan'
                visitDate:
                  type: string
                  format: date
                  example: '2024-01-15'
                coverImage:
                  type: string
                  example: 'https://example.com/image.jpg'
                commentsEnabled:
                  type: boolean
                  example: true
                likesEnabled:
                  type: boolean
                  example: true
      responses:
        201:
          description: Blog post created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogPost'
        400:
          description: Invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid request body properties'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

    get:
      tags:
        - Blog Posts
      summary: Get all blog posts
      description: Retrieves a paginated list of all blog posts with optional search and sorting.
      parameters:
        - name: search_key
          in: query
          schema:
            type: string
          description: Search term to filter posts
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt, title, country, likes, visitDate]
          description: Field to sort by
        - name: limit
          in: query
          schema:
            type: integer
          description: Number of posts to return
        - name: skip
          in: query
          schema:
            type: integer
          description: Number of posts to skip
      responses:
        200:
          description: Blog posts retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 100
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlogPost'
                  limit:
                    type: integer
                    example: 10
                  skip:
                    type: integer
                    example: 0
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

  /api/v1/blog-post/user:
    get:
      tags:
        - Blog Posts
      summary: Get current user's blog posts
      description: Retrieves all blog posts created by the authenticated user.
      security:
        - BearerAuth: []
      responses:
        200:
          description: User's blog posts retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlogPost'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

  /api/v1/blog-post/user/{userId}:
    get:
      tags:
        - Blog Posts
      summary: Get user's blog posts
      description: Retrieves all blog posts created by a specific user.
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        200:
          description: User's blog posts retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlogPost'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

  /api/v1/blog-post/{id}:
    get:
      tags:
        - Blog Posts
      summary: Get a single blog post
      description: Retrieves a specific blog post by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Blog post ID
      responses:
        200:
          description: Blog post retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogPost'
        404:
          description: Blog post not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Post not found'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

    put:
      tags:
        - Blog Posts
      summary: Update a blog post
      description: Updates an existing blog post.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Blog post ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: 'Updated Trip Title'
                content:
                  type: string
                  example: 'Updated content...'
                country:
                  type: string
                  example: 'Japan'
                visitDate:
                  type: string
                  format: date
                  example: '2024-01-15'
                coverImage:
                  type: string
                  example: 'https://example.com/updated-image.jpg'
                commentsEnabled:
                  type: boolean
                  example: true
                likesEnabled:
                  type: boolean
                  example: true
      responses:
        200:
          description: Blog post updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogPost'
        404:
          description: Blog post not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Post not found'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

    delete:
      tags:
        - Blog Posts
      summary: Delete a blog post
      description: Deletes a blog post.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Blog post ID
      responses:
        200:
          description: Blog post deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Blog post deleted successfully'
        404:
          description: Blog post not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Post not found'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

components:
  schemas:
    BlogPost:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        title:
          type: string
          example: 'My Amazing Trip to Japan'
        content:
          type: string
          example: 'This was an incredible journey through the beautiful landscapes of Japan...'
        country:
          type: string
          example: 'Japan'
        visitDate:
          type: string
          format: date
          example: '2024-01-15'
        coverImage:
          type: string
          example: 'https://example.com/image.jpg'
        likes:
          type: integer
          example: 25
        status:
          type: string
          enum: [active, deleted, hidden]
          example: 'active'
        commentsEnabled:
          type: boolean
          example: true
        likesEnabled:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        user:
          $ref: '#/components/schemas/User'

    CreateBlogPostRequest:
      type: object
      required:
        - title
        - content
        - country
      properties:
        title:
          type: string
          example: 'My Amazing Trip to Japan'
        content:
          type: string
          example: 'This was an incredible journey through the beautiful landscapes of Japan...'
        country:
          type: string
          example: 'Japan'
        visitDate:
          type: string
          format: date
          example: '2024-01-15'
        coverImage:
          type: string
          example: 'https://example.com/image.jpg'
        commentsEnabled:
          type: boolean
          example: true
        likesEnabled:
          type: boolean
          example: true

    UpdateBlogPostRequest:
      type: object
      properties:
        title:
          type: string
          example: 'Updated Trip Title'
        content:
          type: string
          example: 'Updated content...'
        country:
          type: string
          example: 'Japan'
        visitDate:
          type: string
          format: date
          example: '2024-01-15'
        coverImage:
          type: string
          example: 'https://example.com/updated-image.jpg'
        commentsEnabled:
          type: boolean
          example: true
        likesEnabled:
          type: boolean
          example: true

    BlogPostListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 100
        posts:
          type: array
          items:
            $ref: '#/components/schemas/BlogPost'
        limit:
          type: integer
          example: 10
        skip:
          type: integer
          example: 0

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userName:
          type: string
          example: johndoe
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          example: john.doe@example.com

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Operation successful'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Error message'
        error:
          type: string
          example: 'Error message'
