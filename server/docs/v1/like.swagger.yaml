paths:
  /api/v1/like/{postId}:
    post:
      tags:
        - Likes
      summary: Toggle like on a post
      description: Toggles the like status for a blog post. If the user has already liked the post, it will unlike it. If not, it will like it.
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
          description: Blog post ID
      responses:
        200:
          description: Like status toggled successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Post liked successfully'
                  liked:
                    type: boolean
                    example: true
                  totalLikes:
                    type: integer
                    example: 25
        400:
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Invalid request parameters'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

    get:
      tags:
        - Likes
      summary: Get likes for a post (authenticated)
      description: Retrieves the likes for a specific blog post with information about whether the current user has liked it.
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
          description: Blog post ID
      responses:
        200:
          description: Post likes retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalLikes:
                    type: integer
                    example: 25
                  hasLiked:
                    type: boolean
                    example: true
                  likes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Like'
        400:
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Invalid request parameters'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

  /api/v1/like/public/{postId}:
    get:
      tags:
        - Likes
      summary: Get likes for a post (public)
      description: Retrieves the likes for a specific blog post without authentication. This endpoint is publicly accessible.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
          description: Blog post ID
      responses:
        200:
          description: Post likes retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalLikes:
                    type: integer
                    example: 25
                  likes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Like'
        400:
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Invalid request parameters'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error'

components:
  schemas:
    Like:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        postId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        user:
          $ref: '#/components/schemas/User'

    ToggleLikeResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Post liked successfully'
        liked:
          type: boolean
          example: true
        totalLikes:
          type: integer
          example: 25

    PostLikesResponse:
      type: object
      properties:
        totalLikes:
          type: integer
          example: 25
        hasLiked:
          type: boolean
          example: true
        likes:
          type: array
          items:
            $ref: '#/components/schemas/Like'

    PublicPostLikesResponse:
      type: object
      properties:
        totalLikes:
          type: integer
          example: 25
        likes:
          type: array
          items:
            $ref: '#/components/schemas/Like'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userName:
          type: string
          example: johndoe
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          example: john.doe@example.com

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: 'Error message'
