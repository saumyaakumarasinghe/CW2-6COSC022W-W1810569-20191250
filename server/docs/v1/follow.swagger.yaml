paths:
  /api/v1/follow/{followedId}:
    post:
      tags:
        - Follows
      summary: Toggle follow for a user
      description: Toggles the follow status for a user. If the current user is already following the target user, it will unfollow them. If not, it will follow them.
      security:
        - BearerAuth: []
      parameters:
        - name: followedId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user to follow/unfollow
      responses:
        200:
          description: Follow status toggled successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Successfully followed user'
                  isFollowing:
                    type: boolean
                    example: true
        400:
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid request parameters'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Internal server error'

  /api/v1/follow/following:
    get:
      tags:
        - Follows
      summary: Get users that the current user is following
      description: Retrieves a list of users that the authenticated user is following.
      security:
        - BearerAuth: []
      responses:
        200:
          description: Following list retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Internal server error'

  /api/v1/follow/followers:
    get:
      tags:
        - Follows
      summary: Get users that follow the current user
      description: Retrieves a list of users that are following the authenticated user.
      security:
        - BearerAuth: []
      responses:
        200:
          description: Followers list retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Internal server error'

  /api/v1/follow/stats:
    get:
      tags:
        - Follows
      summary: Get following and followers count
      description: Retrieves the count of users that the authenticated user is following and the count of users following them.
      security:
        - BearerAuth: []
      responses:
        200:
          description: Follow statistics retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  followingCount:
                    type: integer
                    example: 50
                  followersCount:
                    type: integer
                    example: 75
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Internal server error'

components:
  schemas:
    Follow:
      type: object
      properties:
        id:
          type: integer
          example: 1
        followerId:
          type: integer
          example: 1
        followedId:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        follower:
          $ref: '#/components/schemas/User'
        followed:
          $ref: '#/components/schemas/User'

    ToggleFollowResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Successfully followed user'
        isFollowing:
          type: boolean
          example: true

    FollowStatsResponse:
      type: object
      properties:
        followingCount:
          type: integer
          example: 50
        followersCount:
          type: integer
          example: 75

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userName:
          type: string
          example: johndoe
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          example: john.doe@example.com
        status:
          type: boolean
          example: true
        lastActivateAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Error message'
