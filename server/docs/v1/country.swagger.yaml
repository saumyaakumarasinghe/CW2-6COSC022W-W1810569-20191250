paths:
  /api/v1/country:
    get:
      tags:
        - Countries
      summary: Get all countries
      description: Retrieves a list of all available countries from the REST Countries API.
      security:
        - BearerAuth: []
      responses:
        200:
          description: Countries retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ['Afghanistan', 'Albania', 'Algeria', 'Andorra', 'Angola']
        401:
          description: Unauthorized - User not authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Unauthorized'
        404:
          description: Countries not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Countries not found'
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Failed to fetch countries'

components:
  schemas:
    CountryList:
      type: array
      items:
        type: string
      example: ['Afghanistan', 'Albania', 'Algeria', 'Andorra', 'Angola']

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Error message'
